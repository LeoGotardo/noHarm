# Dependency vulnerability scan.
#
# This repository had no CI at all, so a vulnerable transitive dependency had
# nothing watching for it — the first run of this check found one reachable from
# the production bundle, pulled in by a package package.json had already dropped
# but the lockfile still carried.
#
# The schedule is the part that matters: a dependency does not have to change to
# become vulnerable, so a check that only runs on push goes quiet exactly when
# the tree stops moving. Every advisory the backend's first run found (24 of
# them, across 7 packages, including six in PyJWT, the library that validates
# every access token) landed in code nobody had touched for months.
#
# Separate from deploy.yml on purpose: that workflow is workflow_dispatch-only
# because the ECS stack it targets is not provisioned, so anything hung off it
# never runs, and this is the one check that must keep running whether or not
# a deploy ever happens.

name: security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Mondays, 05:00 UTC: after the cert-renewal cron on the live host, so a
    # Monday morning has one thing to look at, not two.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: audit npm dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile pins and fails if the lockfile disagrees with package.json,
      # which is the state that hid the finding above.
      - name: install
        run: npm ci

      # Two passes, because they answer different questions and only one of them
      # is about users. Anything reachable from the shipped bundle fails the
      # build; a dev-only advisory is reported but does not, since it can only
      # be reached by someone who already runs this repo's code locally.
      - name: audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: audit dev dependencies
        run: npm audit --audit-level=low
        continue-on-error: true

  pip-audit:
    name: audit python dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install pip-audit
        run: pip install pip-audit

      # `pip-audit` resolves the requirements against the PyPI advisory
      # database and exits non-zero on any finding, so a vulnerable pin fails
      # the check rather than being reported into a log nobody reads.
      #
      # requirements-dev.txt pulls in requirements.txt (`-r`), so this covers
      # both: the dev set never reaches the image, but it runs on every
      # developer machine and in CI, which is reason enough to audit it.
      #
      # --require-hashes is deliberately not used: the files pin versions but
      # carry no hashes, and the flag would fail on every line rather than
      # report a vulnerability.
      - name: audit
        run: pip-audit --requirement requirements-dev.txt --progress-spinner off --strict

  # One scan for the whole tree, backend history included: it was a repository
  # of its own, and everything it ever committed is in this one now.
  secrets:
    name: scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a secret removed in a later commit is still
          # in the repository, and still has to be rotated.
          fetch-depth: 0

      # The binary rather than gitleaks-action, which needs a licence key for
      # organisation-owned repositories. Same scanner as the pre-commit hook.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner
